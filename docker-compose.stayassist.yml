# docker-compose.stayassist.yml
# Sprint A.1 — Dedicated Redis container for StayAssist rate limiting
#
# Purpose: Decouples StayAssist rate-limiting Redis from Authentik's internal
#          Redis instance (port 6379). If Authentik Redis dies, intake API
#          continues to operate unaffected (fail-open catch in rate-limit.ts).
#
# Usage:
#   docker compose -f docker-compose.stayassist.yml up -d
#   docker compose -f docker-compose.stayassist.yml down
#
# Verify health:
#   docker exec stayassist-redis redis-cli -a $REDIS_PASSWORD ping
#   → PONG

version: "3.8"

services:
  stayassist-redis:
    container_name: stayassist-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - stayassist-redis-data:/data

volumes:
  stayassist-redis-data:
    driver: local
